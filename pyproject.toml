[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "practicesignal-backend"
version = "0.1.0.dev0"  # M0 baseline (PEP 440 valid; '0.1.0.m0' broke editable installs)
description = "PracticeSignal — Healthcare Practice & Workforce Intelligence (local-first, zero-cost assessment prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary-Assessment" }
authors = [{ name = "Assessment Team" }]

# Zero-cost dependency set (licences recorded in docs/IMPLEMENTATION_PLAN.md §12).
# NOTE (M0): declared here, installed only when a later milestone authorises
# installation. No paid services, trial APIs or key-gated packages appear here.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "rapidfuzz>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
    "model_required: requires a local Ollama runtime (skipped elsewhere, never silently failed — D5/D22)",
]

[tool.setuptools.packages.find]
include = ["backend*"]
